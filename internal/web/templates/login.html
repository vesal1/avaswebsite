{{define "content"}}
<div class="auth-page">
  <section class="panel">
    <div class="panel-head"><h1>Sign in</h1></div>
    <div class="panel-body">
      <form method="post" action="/login" class="stack">
        <input type="hidden" name="next" value="{{.Data.Next}}">
        <div class="field">
          <label for="email">Email address</label>
          <input type="email" id="email" name="email" value="{{.Data.Email}}" required autocomplete="email">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required autocomplete="current-password">
        </div>
        <button type="submit">Sign in</button>
      </form>
    </div>
  </section>
  <p class="muted small">
    No account yet? <a href="/register">Open one</a>.
    Taking a break? Your options are on the
    <a href="/responsible-gambling">safer gambling page</a>.
  </p>
</div>
{{end}}
